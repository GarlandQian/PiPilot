name: Verify source

on:
  workflow_call:
    inputs:
      artifact_prefix:
        type: string
        default: verify

permissions:
  contents: read

env:
  CI: 'true'
  TZ: Asia/Shanghai

jobs:
  unit:
    name: Unit contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.10.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache Electron downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/electron
          key: electron-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit

  desktop:
    name: Build and real Electron contracts (${{ matrix.shard }}/2)
    # Keep the real Electron contract suite on the stable macOS 15 arm64
    # image while the macOS 26 image transition is still flaky.
    runs-on: macos-15
    timeout-minutes: 60
    # Separate machines preserve the suite's one-worker desktop/clipboard
    # isolation while running every test once across both shards.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.10.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache Electron downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/electron
          key: electron-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-downloads-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          electron_config_cache: ${{ github.workspace }}/.cache/electron
      - name: Build
        run: pnpm build
      # Integration cases are a tagged subset of the Electron suite. One full
      # pass covers both without executing those scenarios twice.
      - name: Electron E2E and integration contracts
        run: pnpm test:electron --shard=${{ matrix.shard }}/2
      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-electron-failures-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

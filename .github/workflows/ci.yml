name: CI

on:
  push:
    # Tag pushes are verified by the release workflow itself.
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      artifact_prefix: ci

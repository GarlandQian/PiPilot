name: Public release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without changing GitHub Releases
        required: true
        default: true
        type: boolean

concurrency:
  group: pipilot-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  TZ: Asia/Shanghai

jobs:
  preflight:
    name: Preflight release contract
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.mode.outputs.should_release }}
      replace_existing: ${{ steps.existing.outputs.replace_existing }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Validate tag and package version
        id: version
        shell: bash
        run: |
          ref_tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then ref_tag=""; fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.dry_run }}" != "true" ]]; then
            test "${GITHUB_REF_TYPE}" = tag
          fi
          result="$(node build/release-preflight.cjs "$ref_tag")"
          echo "version=$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.version)' "$result")" >> "$GITHUB_OUTPUT"
          echo "tag=$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(x.tag)' "$result")" >> "$GITHUB_OUTPUT"
      - name: Verify public repository
        run: test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)" = public
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Require annotated stable tag
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        shell: bash
        run: |
          test "${GITHUB_REF_TYPE}" = tag
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
      - name: Require one root commit for the initial release
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.dry_run == false) && steps.version.outputs.version == '0.0.1' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --count "${GITHUB_SHA}")" = 1
          test "$(git rev-list --max-parents=0 --count "${GITHUB_SHA}")" = 1
          test "$(git rev-parse "${GITHUB_SHA}^{commit}")" = "$(git rev-parse "refs/tags/${{ steps.version.outputs.tag }}^{commit}")"
      - name: Inspect existing release
        id: existing
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${{ steps.version.outputs.tag }}" >/tmp/pipilot-existing-release.json 2>/tmp/pipilot-release-error; then
            test "${{ steps.version.outputs.version }}" = '0.0.1'
            test "${{ steps.version.outputs.tag }}" = 'v0.0.1'
            test "$(jq -r '.immutable' /tmp/pipilot-existing-release.json)" = false
            echo 'replace_existing=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat /tmp/pipilot-release-error >&2
          grep -qiE 'not found|404' /tmp/pipilot-release-error
          echo 'replace_existing=false' >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Select dry-run mode
        id: mode
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              echo 'should_release=false' >> "$GITHUB_OUTPUT"
            else
              echo 'should_release=true' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'should_release=true' >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify source and Electron workflows
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.16.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Build
        run: pnpm build
      - name: Integration tests
        run: pnpm test:integration
      - name: Electron E2E
        run: pnpm test:electron
      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-failures-${{ needs.preflight.outputs.version }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Package ${{ matrix.platform }}
    needs: [preflight, verify]
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-26
            command: pnpm package:mac
            smoke: pnpm test:packaged
            artifact_paths: |
              release/*.dmg
              release/*.zip
              release/macos-manifest.json
              release/macos-SHA256SUMS.txt
          - platform: windows
            runner: windows-2025
            command: pnpm package:win:update
            smoke: pnpm test:packaged
            artifact_paths: |
              release/*.exe
              release/latest.yml
              release/*.blockmap
              release/windows-manifest.json
              release/windows-SHA256SUMS.txt
          - platform: linux
            runner: ubuntu-24.04
            command: pnpm package:linux:update
            smoke: xvfb-run --auto-servernum pnpm test:packaged
            artifact_paths: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
              release/*.blockmap
              release/linux-manifest.json
              release/linux-SHA256SUMS.txt
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.16.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Create manifest and checksums
        run: node build/release-manifest.cjs "${{ matrix.platform }}" release
      - name: Configure Linux Chromium sandbox for smoke
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          sandbox='release/linux-unpacked/chrome-sandbox'
          test -f "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          test "$(stat -c '%u:%g:%a' "$sandbox")" = '0:0:4755'
      - name: Smoke-test package
        run: ${{ matrix.smoke }}
      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pipilot-${{ matrix.platform }}-${{ needs.preflight.outputs.version }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble and publish public Release
    needs: [preflight, verify, package]
    if: ${{ needs.preflight.result == 'success' && needs.verify.result == 'success' && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Download native artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pipilot-*
          path: release-candidates
      - name: Validate manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          while IFS= read -r -d '' candidate; do
            name="$(basename "$candidate")"
            if [[ -e "release/$name" ]]; then
              echo "Duplicate release asset: $name" >&2
              exit 1
            fi
            cp "$candidate" "release/$name"
          done < <(find release-candidates -maxdepth 3 -type f -print0)
          node build/validate-release-assembly.cjs release "$VERSION"
          node build/release-notes.cjs "$VERSION" release-notes.md
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
      - name: Remove all previous Actions runs
        if: ${{ needs.preflight.outputs.should_release == 'true' && needs.preflight.outputs.version == '0.0.1' }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[].id' > /tmp/pipilot-action-run-ids.txt
          failed=0
          while IFS= read -r run_id; do
            if [[ -n "$run_id" && "$run_id" != "$GITHUB_RUN_ID" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" || failed=1
            fi
          done < /tmp/pipilot-action-run-ids.txt
          test "$failed" -eq 0
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Stage complete draft Release
        if: ${{ needs.preflight.outputs.should_release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.preflight.outputs.tag }}"
          if [[ "${{ needs.preflight.outputs.replace_existing }}" == 'true' ]]; then
            test "$tag" = 'v0.0.1'
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" release/* \
            --draft \
            --verify-tag \
            --title "PiPilot ${{ needs.preflight.outputs.version }}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify staged Release assets
        if: ${{ needs.preflight.outputs.should_release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.preflight.outputs.tag }}"
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" = false
          for asset in release/*; do basename "$asset"; done | LC_ALL=C sort > /tmp/pipilot-expected-assets.txt
          gh release view "$tag" --json assets --jq '.assets[].name' | LC_ALL=C sort > /tmp/pipilot-published-assets.txt
          diff -u /tmp/pipilot-expected-assets.txt /tmp/pipilot-published-assets.txt
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish staged Release
        if: ${{ needs.preflight.outputs.should_release == 'true' }}
        shell: bash
        run: gh release edit "${{ needs.preflight.outputs.tag }}" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify Release is public
        if: ${{ needs.preflight.outputs.should_release == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.preflight.outputs.tag }}"
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" = false
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" = "$tag"
          for asset in release/*; do basename "$asset"; done | LC_ALL=C sort > /tmp/pipilot-expected-assets.txt
          gh release view "$tag" --json assets --jq '.assets[].name' | LC_ALL=C sort > /tmp/pipilot-published-assets.txt
          diff -u /tmp/pipilot-expected-assets.txt /tmp/pipilot-published-assets.txt
        env:
          GH_TOKEN: ${{ github.token }}
